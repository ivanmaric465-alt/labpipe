# Generated parts (Filter file) are written by entrypoint.sh to /run/labpipe/tinyproxy.filter
User tinyproxy
Group tinyproxy
Port 3128
Listen 127.0.0.1
Bind 0.0.0.0
Allow 127.0.0.1
Timeout 600
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Notice
PidFile "/run/labpipe/tinyproxy.pid"
MaxClients 64
DisableViaHeader Yes
# Host allow-list: default deny, only hosts matching the filter file.
Filter "/run/labpipe/tinyproxy.filter"
FilterType ere
FilterDefaultDeny Yes
FilterExtended Off
# CONNECT only to https.
ConnectPort 443

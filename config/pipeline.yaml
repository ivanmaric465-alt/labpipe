# Pipeline policy shared by everyone using this repository.
# Machine-specific paths (where the raw data is, what must never be written)
# live in config/local.yaml, which is not committed: create it with
# `labpipe init` from config/local.example.yaml.
schema: labpipe.pipeline/2

# Files modified less than this many minutes ago are skipped
# (a cloud sync client or the instrument PC may still be writing them).
settle_minutes: 10

# A failed file is retried only when its hash or the code version changes,
# and at most this many times per file hash.
max_attempts_per_hash: 3

# File names that are never measurements (operating system, office and sync
# client leftovers): not analysed and not reported as unrecognised.
system_files: [".*", "~$*", "~*.tmp", "Thumbs.db", "desktop.ini", "*.tmp", "*.part",
               "*.crdownload", "*.lnk"]

# Your own list of files to leave alone is config/ignore.yaml (git-ignored):
#   ignore: ["TEM/**", "EDS/old notes.docx"]

analysis_dir: analysis
logs_dir: logs
manifest: manifest.json

sample_id:
  rule: "file stem up to the first separator (whole stem if there is none)"
  separators: ["_", " "]      # e.g. "S-9_scan.xrdml", "S-9 a001.tif" -> S-9
  # Accepted IDs look like S-9, AB-3, XYZ-12b. Anything else -> needs_review.
  # Adapt the pattern to your own naming convention.
  pattern: '^[A-Za-z][A-Za-z0-9]*-[0-9]+[A-Za-z]?$'
  overrides_file: config/sample_ids.yaml

# Container mode (docs/design/container.md). It is switched on for a machine by a
# `container:` block in config/local.yaml (`labpipe container setup` writes it).
container:
  name: labpipe              # container name
  image: localhost/labpipe   # tag = image:<container hash>
  port: 8765                 # notifications page, published on 127.0.0.1 only
  allowed_hosts:             # outgoing connections from the container (via its proxy)
    common: [github.com]
    claude-code: [api.anthropic.com, claude.ai, console.anthropic.com, statsig.anthropic.com]
    codex: [api.openai.com, chatgpt.com, auth.openai.com]

# EDS quantification (Oxford INCA HTML reports). Every key can be overridden per
# sample (config/samples.yaml → samples.<id>.eds) or per measurement
# (config/measurements/eds/<measurement_id>.yaml).
schema: labpipe.eds.config/1

# Elements left out of the metal-only composition (all other elements are metals
# there; the full table is always shown as recorded).
non_metals: [C, N, O, F, S, Si, Cl]

# Elements below this are reported as near the detection limit (warning).
low_concentration_wt_percent: 1.0

# Nominal composition, normally per sample in config/samples.yaml, e.g.
#   samples: {S-9: {eds: {nominal_at_percent: {Ru: 20, Rh: 20, Pd: 20, Ir: 20, Pt: 20}}}}
# Renormalised over its metals; compared with the measured metal basis (no flag).
nominal_at_percent: null

# Electron image and spectrum to use, as file names next to the report, normally per
# measurement (config/measurements/eds/<measurement_id>.yaml), when the report links
# the wrong ones, e.g.  images: [s-140.jpg, s-141.jpg].  null = the images it links.
images: null

plot:
  width_in: 7.0       # inches (or single | double): electron image | spectrum | metal bar chart
  dpi: 300
  panels: [image, spectrum, composition]   # which panels to draw (and list in the report)

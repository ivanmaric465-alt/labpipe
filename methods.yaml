# Method registry: file pattern -> method -> analyst agent -> CLI.
# Add a method with `labpipe methods new NAME --example FILE --description TEXT`
# (docs/ADDING_A_METHOD.md); check it with `labpipe methods check NAME --example FILE`.
# A file belongs to the first method whose `ignore` or `patterns` glob matches it
# and, if the method names one, whose `recognise: module:function` content check
# accepts it (for file types several methods share, e.g. .txt).
schema: labpipe.methods/1

methods:
  xrd:
    description: X-ray powder diffraction (PANalytical Empyrean, Cu Kα)
    patterns: ["**/*.xrdml", "**/*.xy"]       # matched against the path relative to the raw root
    primary_extension: .xrdml
    # A secondary file with the same stem (same folder) as a primary file is the
    # same measurement exported twice: recorded as duplicate, not analysed.
    duplicate_of_primary: [.xy]
    ignore: ["**/*.rd", "**/*.rd.bak"]         # legacy binary Philips format: recorded, never analysed
    subagent: xrd-analyst
    cli: "labpipe xrd analyze --entry {entry_id}"
    module: labpipe.methods.xrd.analyze        # must provide run(...) — see docs/ADDING_A_METHOD.md
    cli_extension: labpipe.methods.xrd.refbuild  # optional: adds `labpipe xrd refs ...`
    run_on_host: [refs]                        # optional: subcommands never sent into the container
    plot_modules: [labpipe.methods.xrd.plot]   # drawing only: a change marks "plot out of date", not stale
    # data the numbers depend on, part of the analysis version ("lab/…": in the project)
    analysis_data: ["references/xrd/patterns/*.json", "lab/references/xrd/patterns/*.json"]
    summary: labpipe.methods.xrd.summary       # optional: summarize(results) for the report and agents
    config: config/xrd.yaml
    outputs: [results.json, plot.png, plot.pdf, provenance.json, notes.md]

  sem:
    description: "SEM images (JEOL TIFF with a .txt metadata file of the same name)"
    patterns: ["**/*.tif", "**/*.tiff"]
    ignore: ["**/*.txt"]                       # the JEOL .txt belongs to its image
    recognise: labpipe.methods.sem.analyze:recognise   # only JEOL images and their .txt
    subagent: null                             # analysed by code alone (docs/methods/sem.md)
    notes: false
    report: gallery                            # per-sample gallery instead of one card per image
    gallery: labpipe.methods.sem.gallery
    compare: labpipe.methods.sem.compare      # the grid of images by gallery magnification
    cli: "labpipe sem analyze --entry {entry_id}"
    module: labpipe.methods.sem.analyze
    config: config/sem.yaml
    outputs: [results.json, plot.png, plot.pdf, thumb.jpg, provenance.json]

  eds:
    description: "EDS quantification (Oxford INCA HTML reports with linked images)"
    patterns: ["**/*.htm", "**/*.html"]
    ignore: ["**/*.jpg", "**/*.jpeg", "**/*.ipj"]   # linked images and INCA projects belong to a report
    recognise: labpipe.methods.eds.analyze:recognise   # only INCA reports and what they link
    subagent: eds-analyst
    cli: "labpipe eds analyze --entry {entry_id}"
    module: labpipe.methods.eds.analyze
    summary: labpipe.methods.eds.summary
    compare: labpipe.methods.eds.compare      # the composition bars
    config: config/eds.yaml
    outputs: [results.json, plot.png, plot.pdf, provenance.json, notes.md]
